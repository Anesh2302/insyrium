services:
  - type: web
    name: insyrium-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insyrium-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEV_CONSOLE_OTP
        value: "true"

databases:
  - name: insyrium-db
    plan: free
    databaseName: insyrium
    user: insyrium_app
