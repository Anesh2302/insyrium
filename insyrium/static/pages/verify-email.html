<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="description" content="Verify your Insyrium email address.">
  <title>Insyrium — Verify Email</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <nav class="pg-nav">
    <a class="brand" href="index.html"><span class="brand-mark">◈</span><span class="brand-name">Insyrium</span></a>
    <div class="pg-nav-links"><a class="pg-link" href="index.html">← gallery home</a></div>
    <div class="pg-nav-actions">
      <a class="btn ghost" href="forgot-password.html">Sign in →</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card centered reveal">
        <div class="status-icon ok">✓</div>
        <span class="eyebrow">Almost there</span>
        <h1>Check your inbox</h1>
        <p>We sent a verification link to <strong style="color:var(--text)">jane@company.com</strong>.<br>Open it to activate your account, then sign in.</p>

        <div class="otp-actions" style="justify-content:center">
          <button class="btn primary lg" onclick="demoToast('Verification link sent.', 'info')">Resend link <span class="arrow">→</span></button>
        </div>
        <div class="alert success" style="text-align:left">✓ Account activated — you can sign in now.</div>
        <p class="auth-alt"><a href="forgot-password.html">Go to sign in</a></p>
      </div>
      <p class="utility-alt">Static preview — demo interaction only.</p>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="pages.js"></script>
</body>
</html>
