<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="description" content="Reset your Insyrium password.">
  <title>Insyrium — Forgot Password</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <nav class="pg-nav">
    <a class="brand" href="index.html"><span class="brand-mark">◈</span><span class="brand-name">Insyrium</span></a>
    <div class="pg-nav-links"><a class="pg-link" href="index.html">← gallery home</a></div>
    <div class="pg-nav-actions">
      <a class="btn ghost" href="forgot-password.html">Sign in →</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card reveal">
        <div class="auth-head centered" style="text-align:center">
          <div class="status-icon info">🔑</div>
          <span class="eyebrow">Account recovery</span>
          <h1>Reset your password</h1>
          <p>Enter your account email and we'll send a recovery link. No codes, no fuss.</p>
        </div>

        <form id="reset-form" class="stack" style="margin-top:1.4rem">
          <div class="field">
            <label for="r-email">Email</label>
            <input id="r-email" type="email" autocomplete="email" required placeholder="you@company.com" autofocus>
          </div>
          <div class="alert success" hidden id="r-done">✓ If an account exists, a recovery link is on its way.</div>
          <p class="form-error" id="r-error" hidden></p>
          <button class="btn primary lg" type="submit" onclick="event.preventDefault(); document.getElementById('r-done').hidden=false; this.disabled=true; this.textContent='Link sent ✓';">Send reset link <span class="arrow">→</span></button>
        </form>

        <p class="auth-alt">Remembered it? <a href="forgot-password.html">Back to sign in</a></p>
      </div>
      <p class="utility-alt">Static preview — demo interaction only.</p>
    </div>
  </div>

  <script src="pages.js"></script>
</body>
</html>
